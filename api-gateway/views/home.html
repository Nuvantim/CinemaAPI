<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CinemaAPI 🎬</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <!-- Library GSAP -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <style>
      body {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background: linear-gradient(135deg, #fff5f5 0%, #fed7d7 100%);
        padding: 20px;
        font-family: "Inter", "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        overflow-x: hidden;
      }

      /* 🔹 Styling Tirai Bioskop */
      .curtain-wrapper {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        pointer-events: none;
      }

      .curtain {
        width: 50%;
        height: 100%;
        /* Efek lipatan tirai merah beludru */
        background: repeating-linear-gradient(
          90deg,
          #7b0000 0px,
          #b80000 25px,
          #590000 50px
        );
        box-shadow: inset 0 0 60px rgba(0, 0, 0, 0.7);
      }

      .curtain-left {
        border-right: 3px solid #d4af37; /* Lis emas tipis di tengah */
      }

      .curtain-right {
        border-left: 3px solid #d4af37;
      }

      /* 🔹 Card CinemaAPI */
      .card {
        box-shadow: 0 10px 30px rgba(229, 62, 62, 0.15);
        border-radius: 12px;
        overflow: hidden;
        max-width: 600px;
        width: 100%;
        animation: card-pulse 1.5s ease-in-out infinite;
        transition:
          transform 0.3s ease,
          box-shadow 0.3s ease;
      }

      @keyframes card-pulse {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.02);
        }
      }

      .card:hover {
        transform: translateY(-10px) scale(1.05);
        box-shadow: 0 25px 50px rgba(229, 62, 62, 0.3);
        animation: none;
      }

      .card-header {
        background: linear-gradient(90deg, #ff3860 0%, #c53030 100%);
        padding: 20px;
      }

      .card-header-title {
        color: white;
        font-size: 1.8rem;
        font-weight: 600;
        text-align: center;
        width: 100%;
      }

      .card-content {
        padding: 30px;
      }

      .api-icon {
        font-size: 3rem;
        margin-bottom: 20px;
        color: #e53e3e;
        text-align: center;
        display: block;
        animation: icon-shake 1.2s ease-in-out infinite;
      }

      @keyframes icon-shake {
        0%,
        100% {
          transform: translateX(0) rotate(0);
        }
        25% {
          transform: translateX(-2px) rotate(-2deg);
        }
        50% {
          transform: translateX(2px) rotate(2deg);
        }
        75% {
          transform: translateX(-1px) rotate(-1deg);
        }
      }

      .title {
        text-align: center;
        font-weight: 600;
      }
      .description {
        text-align: justify;
        line-height: 1.6;
        font-size: 1rem;
        color: #333;
      }

      .button {
        margin-top: 20px;
        font-weight: 600;
        display: block;
        margin-left: auto;
        margin-right: auto;
        transition:
          background-color 0.3s ease,
          color 0.3s ease;
      }

      .button:hover {
        background-color: #c53030 !important;
        color: #fff;
      }
    </style>
  </head>
  <body>
    <!-- Elemen Tirai -->
    <div class="curtain-wrapper" id="curtainWrapper">
      <div class="curtain curtain-left"></div>
      <div class="curtain curtain-right"></div>
    </div>

    <!-- Konten Utama -->
    <div class="card">
      <header class="card-header">
        <p class="card-header-title">CinemaAPI</p>
      </header>
      <div class="card-content">
        <div class="content">
          <div class="has-text-centered">
            <i class="fas fa-film api-icon"></i>
          </div>
          <h2 class="title is-3">CinemaAPI</h2>
          <p class="description">
            The system leverages the <strong>HTTP/2</strong> protocol to enable
            fast and reliable communication between services, while
            <strong>Redis caching</strong> is utilized to optimize performance
            and accelerate access to frequently requested data.
          </p>
          <a class="button is-danger is-medium" href="/docs">
            <span class="icon"><i class="fas fa-book"></i></span>
            <span>API Documentation</span>
          </a>
        </div>
      </div>
    </div>

    <script>
      window.addEventListener("DOMContentLoaded", () => {
        const tl = gsap.timeline({
          onComplete: () => {
            document.getElementById("curtainWrapper").style.display = "none";
          },
        });

        // Tirai kiri bergeser ke kiri, tirai kanan bergeser ke kanan
        tl.to(
          ".curtain-left",
          {
            xPercent: -100,
            duration: 1.6,
            delay: 0.3,
            ease: "power3.inOut",
          },
          0,
        ).to(
          ".curtain-right",
          {
            xPercent: 100,
            duration: 1.6,
            delay: 0.3,
            ease: "power3.inOut",
          },
          0,
        );
      });
    </script>
  </body>
</html>
